
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ایران، هزار رنگ | نمایشگاه هنری</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #f5e7ce;
}

body {
    font-family: Tahoma, Arial, sans-serif;
}

.homepage {
    position: relative;
    width: 100%;
    max-width: 1800px;
    margin: 0 auto;
    line-height: 0;
}

.homepage img {
    display: block;
    width: 100%;
    height: auto;
}

/* محدوده کلیک هر کارت */

.hotspot {
    position: absolute;
    display: block;
    z-index: 5;
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s ease;
}

.hotspot:hover {
    background: rgba(255,255,255,0.08);
}

.hotspot:focus-visible {
    outline: 4px solid #a83b19;
    outline-offset: 4px;
}

/* کارت اول: معرفی مناطق و آثار */

.regions {
    left: 66.4%;
    top: 49.8%;
    width: 30.7%;
    height: 31.2%;
}

/* کارت دوم: گالری سه‌بعدی */

.gallery3d {
    left: 34.4%;
    top: 49.8%;
    width: 30.8%;
    height: 31.2%;
}

/* کارت سوم: تصاویر نمایشگاه حضوری */

.exhibition {
    left: 3%;
    top: 49.8%;
    width: 30.8%;
    height: 31.2%;
}

/* نمایش در موبایل */

@media (max-width: 700px) {

    .hotspot {
        border-radius: 3vw;
    }

}
</style>
</head>

<body>

<main class="homepage">

    <!-- تصویر اصلی طراحی‌شده -->

    <img
        src="homepage-design.png"
        alt="ایران، هزار رنگ؛ روایت تصویری پوشش زنان ایران"
    >

    <!-- گزینه اول -->

    <a
        class="hotspot regions"
        href="regions.html"
        aria-label="معرفی مناطق و آثار"
        title="معرفی مناطق و آثار">
    </a>

    <!-- گزینه دوم -->

    <a
        class="hotspot gallery3d"
        href="3d-gallery.html"
        aria-label="گالری سه‌بعدی"
        title="گالری سه‌بعدی">
    </a>

    <!-- گزینه سوم -->

    <a
        class="hotspot exhibition"
        href="exhibition-photos.html"
        aria-label="تصاویر نمایشگاه حضوری"
        title="تصاویر نمایشگاه حضوری">
    </a>

</main>

</body>
</html>
